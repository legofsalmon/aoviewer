name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  design-system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the page's inlined design system: not edited by hand, every role it reads exists
      - name: Design system copy
        run: python3 scripts/ds/ds_check.py index.html scripts/ds --reads index.html
